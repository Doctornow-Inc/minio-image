name: Publish
on:
  workflow_dispatch:
    inputs:
      overwrite:
        description: Replace an existing tag (consumers pinned by digest are unaffected)
        type: boolean
        default: false
permissions: {}
env:
  IMAGE: ghcr.io/doctornow-inc/minio
  TAG: RELEASE.2025-04-22T22-12-26Z
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3      # the final stage's `apk add` runs under emulation
      - uses: docker/setup-buildx-action@v3
      # Log in before the overwrite check: while the package is still private, an anonymous
      # inspect can't see the tag and the check would pass wrongly.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing tag
        if: ${{ !inputs.overwrite }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
            echo "::error::$IMAGE:$TAG already exists; re-run with overwrite=true to replace it"
            exit 1
          fi
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Keep the index to the two real platforms; no attestation manifests.
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
      - name: Record digest
        run: |
          echo "Published \`$IMAGE:$TAG@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
